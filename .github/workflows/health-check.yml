name: Health check

on:
  schedule:
    - cron: "17 14 * * *"   # daily, ~6–7am Pacific
  workflow_dispatch:
  pull_request:
    paths:
      - "config/sources.yaml"
      - "scripts/**"
      - ".github/workflows/health-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml
      - name: Discover candidate sources (PRs only)
        if: github.event_name == 'pull_request'
        run: python scripts/discover_sources.py
      - name: Check configured sources
        run: python scripts/health_check.py
